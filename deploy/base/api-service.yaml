apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app: api
spec:
  # ClusterIP for local/kind (reach it with `kubectl port-forward svc/api 8000:80`).
  # On EKS switch this to LoadBalancer, or put an Ingress in front.
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8000
  selector:
    app: api
