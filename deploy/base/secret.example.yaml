# TEMPLATE. For real use:
#   cp secret.example.yaml secret.yaml   &&   $EDITOR secret.yaml   &&   gitignore secret.yaml
# stringData keeps values readable — Kubernetes base64-encodes them for you.
#
# NOTE: the password appears twice (POSTGRES_PASSWORD and inside DATABASE_URL);
# keep them identical. The host "postgres" must match the Service name.
apiVersion: v1
kind: Secret
metadata:
  name: vns-secret
type: Opaque
stringData:
  POSTGRES_USER: "vns"
  POSTGRES_PASSWORD: "change-me"
  DATABASE_URL: "postgresql+psycopg2://vns:change-me@postgres:5432/vns"
